[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina-raw"
version = "0.1.0.dev0"
description = "A local Camera Raw XMP read/write proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["lxml>=6.1.1,<7"]

[project.scripts]
lumina = "lumina.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
