name: Tests and package

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check code
        run: python -m ruff check src tests tools
      - name: Check panel startup
        run: node tools/check_panel.cjs
      - name: Build from source archive
        run: python -m build
      - name: Verify package contents
        run: python tools/check_distribution.py
      - name: Install built wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          wheel, = Path('dist').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)
      - name: Test installed package
        run: python -m coverage run -m pytest
      - name: Coverage summary
        run: python -m coverage report
      - name: Check command entry point
        run: lumina --version
