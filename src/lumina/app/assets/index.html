<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumina · RAW 调整</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><h1>Lumina <span>RAW 调整</span></h1><span id="connection-state">尚未连接</span></header>
<div class="connection"><span id="model" class="muted">本地模式</span><button id="connect">载入连接文件</button><input type="file" id="connection-file" accept=".json" hidden></div>
<section class="file-panel" aria-label="照片"><label for="nef">文件</label><div class="row"><input id="nef" placeholder="NEF 完整路径，例如 D:\photo\DSC_3954.NEF"><button id="pick" hidden>选择照片</button><button id="read">读取</button></div><p class="hint">需要同名 XMP。修改前请先在 Camera Raw 中保存并关闭照片。</p></section>
<div class="columns">
<section class="panel editor"><h2>调整</h2><div class="panel-body">
<label for="mode">模式</label><select id="mode"><option value="local">本地摄影词典</option><option value="numeric">明确参数指令</option><option value="ai">AI 辅助建议</option><option value="style">我的风格</option></select>
<label id="text-label" for="text">调整需求</label><textarea id="text" rows="3" placeholder="压高光，拉阴影，整体提亮"></textarea>
<div id="style-controls" hidden><label for="style">个人风格</label><select id="style"><option value="">还没有保存的风格</option></select><p class="hint">根据当前照片重新计算参数增减量。</p></div>
<label id="consent-row" class="check" hidden><input id="consent" type="checkbox"><span>同意向所示模型服务发送当前十项参数、处理版本、白平衡模式和需求，不发送照片或路径。</span></label>
<div class="actions"><button id="preview">生成预览</button></div></div>
<h3>当前参数</h3><div id="current" class="parameters"><p class="hint">读取照片后显示参数</p></div></section>
<section class="panel review"><h2>参数预览</h2><div class="panel-body">
<div class="table-head"><span>参数</span><span>当前</span><span>调整后</span></div><div id="changes" class="empty">尚未生成预览</div>
<p id="explanation" class="hint"></p><div id="warnings" class="warnings"></div>
<div class="apply-area"><label class="check"><input id="closed" type="checkbox"><span>已保存并关闭 Camera Raw 中的这张照片</span></label><div class="actions"><button id="reopen" hidden>在 Photoshop 中打开</button><button id="apply" class="primary" disabled>应用</button></div><p class="hint">应用后重新打开 NEF 检查效果。</p></div>
<div class="save-style"><label for="style-name">保存为个人风格</label><div class="row"><input id="style-name" maxlength="80" placeholder="风格名称"><button id="save-style" disabled>保存风格</button></div></div>
</div></section></div>
<section class="panel history"><div class="panel-heading"><h2>历史记录</h2><button id="refresh">刷新</button></div><div class="panel-body"><p class="hint">当前照片的最近记录。“待核对”时请检查 XMP 与备份，勿重复应用。</p><div id="history" class="muted">暂无记录</div></div></section>
<footer><p id="message" role="status" aria-live="polite">就绪。请选择照片。</p><span>NEF / XMP</span></footer>
</main><script src="panel.js"></script></body></html>
